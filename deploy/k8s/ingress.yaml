apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rollreviewer-ingress
  namespace: rollreviewer
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: rollreviewer.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: rollreviewer-backend
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rollreviewer-frontend
                port:
                  number: 80
