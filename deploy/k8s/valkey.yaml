apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollreviewer-valkey
  namespace: rollreviewer
  labels:
    app.kubernetes.io/name: rollreviewer
    app.kubernetes.io/component: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/component: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.0-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rollreviewer-valkey
  namespace: rollreviewer
  labels:
    app.kubernetes.io/name: rollreviewer
    app.kubernetes.io/component: valkey
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/component: valkey
