apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollreviewer-backend
  namespace: rollreviewer
  labels:
    app.kubernetes.io/name: rollreviewer
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rollreviewer
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/rollreviewer/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: rollreviewer-config
            - secretRef:
                name: rollreviewer-secrets
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rollreviewer-backend
  namespace: rollreviewer
  labels:
    app.kubernetes.io/name: rollreviewer
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3001
      targetPort: http
  selector:
    app.kubernetes.io/component: backend
