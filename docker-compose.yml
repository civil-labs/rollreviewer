services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '3001:3001'
    environment:
      - OC_RR_NODE_ENV=development
      - OC_RR_PORT=3001
      - OC_RR_LOG_LEVEL=debug
      - OC_RR_OIDC_ISSUER=http://mock-oauth.local:8080/default
      - OC_RR_OIDC_AUTH_URL=http://mock-oauth.local:8080/default
      - OC_RR_OIDC_TOKEN_URL=http://mock-oauth.local:8080/default
      - OC_RR_OIDC_CLIENT_ID=rollreviewer-client
      - OC_RR_OIDC_CLIENT_SECRET=rollreviewer-secret
      - OC_RR_OIDC_REDIRECT_URI=http://localhost:3001/api/auth/callback
      - OC_RR_VALKEY_URL=redis://valkey:6379
      - OC_RR_BASEMAP_URL=https://demotiles.maplibre.org/style.json
      - OC_RR_OPA_URL=http://opa:8181
    depends_on:
      - valkey
      - mock-oauth2-server
      - opa
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - app-net

  valkey:
    image: valkey/valkey:8.0-alpine
    ports:
      - '6379:6379'
    networks:
      - app-net

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.0
    ports:
      - '8080:8080'
    environment:
      - SERVER_PORT=8080
      - JSON_CONFIG={"interactiveLogin":true,"httpServer":"NettyWrapper"}
    hostname: mock-oauth.local
    networks:
      app-net:
        aliases:
          - mock-oauth.local

  opa:
    image: openpolicyagent/opa:latest
    ports:
      - '8181:8181'
    command:
      - 'run'
      - '--server'
      - '--addr=0.0.0.0:8181'
    networks:
      - app-net

networks:
  app-net:
    driver: bridge